[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-load-forge"
version = "1.0.0"
description = "Forge your MCP server under real load — cold start, ramp-up, sustained, and spike phases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "performance", "load-testing", "agentic-ai", "llm"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "bandit>=1.7", "pip-audit>=2.6"]

[project.scripts]
mcp-load-forge = "mcp_load_forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["mcp_load_forge/tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["mcp_load_forge/tests"]
skips = []
